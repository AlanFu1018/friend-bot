# ==============================================================================
# Friend-Bot 設定檔 (config.yaml)
# ==============================================================================

# Discord 機器人頻道與行為設定
bot:
  # 【互動與回覆頻道】機器人在該頻道發言並與大家聊天的專屬頻道 ID 列表
  reply_channel_ids: []

  # 【純監聽與記憶頻道】機器人會默默旁聽、記錄對話歷史並更新用戶特徵，但「不會主動回覆」的頻道 ID 列表
  listen_channel_ids: []
  
  # 是否在生成回應時顯示 Discord 的「正在輸入... (Typing)」狀態
  show_typing: true
  
  # 單則 Discord 訊息最大字元數 (Discord 預設上限為 2000)
  max_message_length: 2000

# 訊息發送與自然氣泡行為設定
chat_behavior:
  # 略過/繞過前綴（以這些前綴開頭的訊息將完全被機器人忽略：不監聽、不記錄、不回覆）
  ignore_prefixes: ["#", "＃", "//"]

  # 是否開啟擬真多氣泡自然分段發送
  enable_multi_bubble: true
  
  # 單則氣泡的目標字數（達到此字數時將尋找最近的句號、換行等標點切分為下一則訊息）
  bubble_target_length: 47
  
  # 多則訊息之間的擬真打字停頓時間（秒）[最小秒數, 最大秒數]
  typing_delay_range: [0.6, 1.3]

  # 【多人群聊短時熱絡 (Burst) 聚合與動態引用回覆設定】
  burst_reply:
    # 是否啟用短時多人發言聚合與動態引用機制
    enable_burst_reply: true
    # 短時收集窗口（秒）：在此時間內若有新訊息且有多人發言，則等待收集完成
    window_seconds: 4.5
    # 觸發 Burst 的最小不同用戶數門檻（預設 2 人）
    min_user_count: 2
    # 單次 Burst 最多收集的訊息數量上限（達到上限立即觸發）
    max_burst_messages: 5

# 聯網即時搜尋與網頁閱讀 (Web Search Tool) 設定
web_search:
  # 是否啟用 DuckDuckGo + Jina AI Reader 即時聯網檢索工具
  enable_web_search: true
  
  # 搜尋抓取排名前 N 名的網址
  search_top_k: 3
  
  # 單一網頁透過 Jina AI 擷取 Markdown 內容的最大字元上限（避免 context 過長）
  max_content_length_per_page: 2500

# 行事曆與 Webhook 定時提醒設定
calendar:
  # 全域預設 Webhook URL（選填，若未填則自動在目標頻道調用或建立 Webhook / 頻道發送）
  webhook_url: ""
  # Webhook 顯示的紅莉棲頭像圖片 URL（選填）
  avatar_url: ""

# Gemini AI 模型設定
gemini:
  # 預設使用的 Gemini 模型。(agent勿改動此設定)
  model: "gemini-3.1-flash-lite"
  
  # 溫度值 (0.0 ~ 2.0)：數值越高越隨機幽默，數值越低越精準嚴謹
  temperature: 0.87
  
  # 頻率/存在懲罰（注意：多數 Gemini 模型後端目前尚未啟用 Penalty，若設定非 0 且 API 報錯時系統會自動安全降級重試）
  frequency_penalty: 0.0
  presence_penalty: 0.0
  
  # 單次最大生成 Token 數
  max_output_tokens: 2048

# 三層全記憶系統設定
memory:
  # 第 1 層 (短期記憶)：送入 Prompt 的最近頻道對話訊息數量
  short_term_history_limit: 30
  
  # 第 2 層 (長期畫像)：是否開啟背景自動分析對話並提取/更新用戶特徵（含純監聽頻道）
  enable_auto_memory_extraction: true

  # 監聽頻道防抖秒數：該頻道靜默滿這麼久才把累積的對話打包送去提煉
  # 每來一則新訊息就重新計時。調大 = 一次分析更完整的多輪脈絡、API 呼叫更少，
  # 但記憶更新較慢；調小 = 更即時，但可能把一段完整對話切成好幾次提煉。
  listen_debounce_seconds: 4.0

  # 監聽頻道佇列的訊息則數上限：累積滿這麼多則就立即提煉，不再等靜默。
  # 這是防抖機制的保險——熱絡頻道若持續有人發言（間隔都短於防抖秒數），
  # 計時器會被無限重設，佇列將無上限成長並在最後產生超大 prompt。
  # 若要調大 listen_debounce_seconds，建議一併確認此上限是否合適。
  listen_max_queue_messages: 30

  # 背景撿漏間隔秒數：定期掃描並重試「提煉失敗」或「重啟導致監聽佇列遺失」的殘留訊息
  # 正常情況下各路徑提煉完就會標記完成，這裡通常無事可做，因此不需要太頻繁。
  extraction_sweep_interval_seconds: 600

  # 【別名 (Alias) 設定】讓群友慣用的綽號也能被辨識
  # Discord 顯示名稱常常不是大家實際互稱的稱呼；別名與 user_name 分開儲存，
  # 不會被背景提煉覆寫，設了就會保留。
  alias:
    # 是否允許背景提煉自動學習別名。
    # 注意：只有在「當事人於該次對話中在場（有發言或被 @提及）」時才可能學到，
    # 系統不會替一個從未現身的人猜測稱呼。
    # 若發現模型因為多一項輸出而拉低了 facts／好感度的品質，可關閉此項改用指令設定。
    enable_alias_learning: true

    # 每人別名數量上限。達上限時拒絕新增並記錄 log，不會自動淘汰既有別名。
    # 別名越多，「誰命中誰」的碰撞風險越高，不建議設得太大。
    max_aliases_per_user: 10

    # 是否允許背景提煉主動幫群友發想暱稱（而非只是聽到既有稱呼才記錄）。
    # 觸發時機與別名學習完全相同（同一次背景提煉、當事人在場時），沒有額外的
    # 冷卻或「只提議一次」限制，一樣受 max_aliases_per_user 與碰撞排除保護。
    enable_ai_invented_alias: true

    # 只有關係階級達到此 Tier 數（1~4，對應 stranger/familiar/trusted/cherished）
    # 以上才會被主動取暱稱。預設 3 = trusted（實驗室夥伴）。
    invented_alias_min_tier: 3

  # 【三軌事實記憶檢索 (3-Track Fact RAG & Heat) 設定】
  facts_rag:
    # 主要發言者 (Speaker) 事實配額設定
    speaker_max_total: 8      # 主要發言者最多帶入的事實總數
    speaker_heat_limit: 2     # 軌道 1：核心高頻事實數量上限
    speaker_recent_limit: 2   # 軌道 3：最新近況事實數量上限
    
    # 在場 / 被提及其他群友 (In-context / Others) 事實配額設定
    others_max_total: 3       # 每位其他群友最多帶入的事實總數
    others_heat_limit: 1      # 軌道 1：核心高頻事實數量上限
    others_recent_limit: 1    # 軌道 3：最新近況事實數量上限
    
    # 雙重熱度加權與防刷設定
    rag_hit_cooldown_seconds: 3600  # 即時對話 RAG 命中加權冷卻時間（秒，預設 1 小時）
    extraction_reaffirm_bonus: 3    # 背景提煉重複確認事實之熱度加權增量 (hits += N)
    rag_hit_bonus: 1                # 即時對話話題命中事實之熱度加權增量 (hits += N)

  # 第 3 層 (深層歷史回憶)：是否在檢測到話題或回憶觸發時自動檢索過去相關歷史對話（跨頻道回憶）
  enable_history_recall: true
  
  # 每次歷史回憶檢索注入的歷史片段數量上限
  history_recall_limit: 4

  # 深層回憶的最低相關性門檻：一則歷史訊息需與當前話題共享「至少幾個字的共同詞彙」
  # 2 = 至少共享一個二字詞（如「拉麵」）；3 = 只有三字以上的詞才算相關（更嚴格）
  # （調高 = 寧缺勿濫，寧可不召回也不把無關舊話塞進 prompt；調低 = 廣泛召回）
  history_recall_min_score: 2

  # 單次深層回憶查詢最多帶入的關鍵字數量上限（超過則優先捨棄較短、鑑別度較低的關鍵字）
  # 避免多人群聊 (Burst) 的長查詢串產生過於龐大的 FTS5 MATCH 運算式
  history_recall_max_query_tokens: 30
  
  # 本地 SQLite 資料庫儲存路徑（永久保存所有訊息與記憶）
  db_path: "data/friend_bot.db"

  # 【事實容量控制與語意去重 (Facts Capacity & Dedup) 設定】
  # 機制 A（硬上限淘汰）與機制 B（語意去重）是兩個獨立機制：
  # A 在每次寫入時同步執行，保證 facts 數量任何時刻都有界；
  # B 是背景批次的品質優化，透過 embedding 分群 + Gemini 判斷是否為同一事實，
  # 減少「同一件事、不同講法」造成的假性膨脹，降低 A 需要淘汰真實事實的頻率。
  facts_maintenance:
    # 【機制 A】每人事實儲存上限（非檢索配額，是真正寫入 DB 的硬上限）。
    # 超過時依熱度(hits)由低到高、最後使用時間(last_used_at)由舊到新排序淘汰，
    # 優先保留熱門與近期事實。這是唯一保證事實數量不會無限增長的機制。
    max_stored_per_user: 10000

    # 【機制 B】是否啟用背景語意去重批次。
    enable_dedup: false

    # 分群時的 cosine 相似度門檻（0~1）。超過此值才視為候選重複群組，越高越保守。
    dedup_similarity_threshold: 0.86

    # 單一群組送進 Gemini 判斷的事實數量上限，避免單次呼叫過大或判斷品質下降。
    dedup_cluster_max_size: 6

    # 每位使用者每天最多讓幾條事實進入去重流程（含 embedding 補算與分群比對）。
    # 這是 process 內的記憶體計數（重啟會歸零），目的是壓低 API 用量的軟上限，
    # 不影響機制 A 的事實數量上界保證，只是讓機制 B 的處理速度變慢。
    dedup_max_facts_per_user_per_day: 40

    # 用於計算事實 embedding 的模型代號。換模型後舊向量會自動判定過期並重算。
    embedding_model: "gemini-embedding-001"

    # 單次 BatchEmbedContents API 呼叫最多送幾筆文字。Gemini API 硬限制是 100，
    # 超過會整批被 400 INVALID_ARGUMENT 拒絕，所以這裡分批送出。
    embedding_batch_size: 100

    # 分批呼叫之間刻意等待的秒數，避免連續送出多個批次觸發速率限制。
    embedding_batch_delay_seconds: 1.0

    # 背景語意去重批次的執行間隔秒數。
    dedup_sweep_interval_seconds: 86400

  # 【互動印象保護 (Interaction Notes Protection) 設定】
  # 模型每次提煉會整段輸出 interaction_notes（含【核心性格】【社交關係】【近期動態】三個
  # 標籤），先前沒有任何保護機制——一次輸出格式跑掉或忘記帶入舊人設，累積最久、最難
  # 重建的【核心性格】就會永久消失（見 memory_sys_design.md §10）。
  interaction_notes_protection:
    # 【核心性格】【社交關係】段落的疑似遺失判定門檻：新段落字數低於舊版此比例時，
    # 視為異常萎縮，該段落保留舊版（【近期動態】不受此限制，本來就該每次更新）。
    shrink_ratio: 0.4

# 語音頻道感知與音樂推薦 (Music Suggestion) 設定
music:
  # 是否啟用語音頻道感知與音樂推薦。
  # 現在音樂 bot（Muse）用文字前綴指令（如 m.play）且不忽略其他 bot 的訊息，
  # 因此紅莉栖判斷該推薦音樂時會「直接代發指令」讓歌真的播放，不再只是建議群友複製。
  enable_music_suggestion: true

  # 實際代發時使用的指令前綴＋子指令。換用其他音樂 bot 時只要改這裡，不需改程式碼。
  play_command: "m.play"

  # 最多帶入幾位語音在場者的喜好（與其他群友共用 max_others 配額）
  voice_members_max: 5

  # 代發 play_command 指令訊息的頻道 ID（也可用 .env 的 MUSIC_COMMAND_CHANNEL_ID 設定）。
  # 留空則直接送到觸發這次回覆的當下頻道。
  command_channel_id: ""

# 好感度與人際進展 (Favorability & Progression) 設定
favorability:
  # 是否開啟動態好感度與人際關係進展系統
  enable_favorability: true

  # 新用戶初始預設好感度數值 (0 ~ 100)
  default_favorability: 30

  # 單一用戶「每日好感度增加上限」（防止洗頻刷分）
  daily_gain_limit: 15

  # 單一用戶「每日好感度扣分上限」（避免因少數誤判過度扣分）
  daily_loss_limit: 20
