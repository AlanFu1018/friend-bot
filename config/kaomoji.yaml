# ==============================================================================
# 稀有顏文字（抽卡隱藏款）
# 每次挑選顏文字時有 emotion.rare.chance（預設 1%）機率改從這裡抽，
# 抽中的款式在 emotion.rare.cooldown_hours 內不會再次出現。沒列出的類別就沒有稀有款。
# ==============================================================================
rare_kaomoji:
  tsundere:
    - '(〃ﾉωﾉ)ﾟ･｡*✧ 才、才不是為了你呢！'
    - '(//▽//)ゞ ✧*。べ、別盯著看啦'
  proud:
    - '( ￣ー￣)ｂ ✧ El Psy Kongroo'
    - '(๑•̀ㅂ•́)و✧ ——天才的實力。'
  angry:
    - '(╯°□°）╯︵ ┻━┻'
  soft:
    - '(っ´ω`)ﾉ(╥ω╥) ✧ 乖、乖啦'
    - '｡･ﾟ♡ﾟ･｡ (*´▽`*) ｡･ﾟ♡ﾟ･｡'
  shock:
    - 'Σ(ﾟДﾟ；≡；ﾟдﾟ) 世界線變動了！？'
  depressed:
    - '_(:3 」∠)_'

# ==============================================================================
# 情緒慣性規則
# 格式：{頻道目前的心情: {模型想輸出的情緒: 實際改抽的類別}}
# 只有當心情強度達到「明顯」以上時才會生效（見 core/mood.py 的 INERTIA_MIN_INTENSITY）。
# ==============================================================================
mood_transitions:
  # 還在氣頭上：開心也嘴硬；得意時帶著不爽
  angry:
    soft: tsundere
    proud: sigh
  # 害羞還沒退：溫柔變成害羞
  tsundere:
    soft: tsundere
    proud: tsundere
  # 難過時逞強：得意變尷尬、開心帶點苦
  sad:
    proud: awkward
    soft: awkward
  depressed:
    proud: awkward
    soft: sigh
  # 驚魂未定：得意不起來
  shock:
    proud: awkward
